name: Rideze Automation Regression Suite

on:
  push:
    branches: ["qa-automation-suite", "main"]
  pull_request:
    branches: ["qa-automation-suite", "main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - staging
          - dev

jobs:
  test:
    name: Run Full E2E & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Ensure Google Chrome is Installed
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run TestNG Suite
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'qa' }}"
          mvn clean test -Denv=$TARGET_ENV -Dheadless=true -Dtest="!DriverShiftStatusTest"

      - name: Archive ExtentReport Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-html-report
          path: reports/ExtentReport.html
          retention-days: 14

      - name: Archive Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14
