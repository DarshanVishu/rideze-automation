name: Rideze Automation Regression Suite

on:
  push:
    branches: ["qa-automation-suite", "main"]
  pull_request:
    branches: ["qa-automation-suite", "main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - staging
          - dev

jobs:
  test:
    name: Run Backend, Security & API Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Ensure Google Chrome is Installed
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run TestNG Suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          CUSTOMER_BASE_URL: ${{ secrets.CUSTOMER_BASE_URL }}
          CUSTOMER_PHONE: ${{ secrets.CUSTOMER_PHONE }}
          CUSTOMER_OTP: ${{ secrets.CUSTOMER_OTP }}
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'qa' }}"
          mvn clean test \
            -Denv=$TARGET_ENV \
            -Dheadless=true \
            -Dtest="!Driver*Test,!Vehicles*Test,!ReviewsTest,!CustomerBookingTest,!LoginTest"

      - name: Print Test Results Summary
        if: always()
        run: |
          echo "==================== TEST EXECUTION SUMMARY ===================="
          if [ -d "target/surefire-reports" ]; then
            grep -rn "FAILURE" target/surefire-reports/*.txt 2>/dev/null || true
            grep -rn "ERROR" target/surefire-reports/*.txt 2>/dev/null || true
            for file in target/surefire-reports/*.txt; do
              if grep -q "FAILURE\|ERROR" "$file"; then
                echo "------------------- Failures in $file -------------------"
                head -n 25 "$file"
              fi
            done
          else
            echo "No surefire reports directory found."
          fi
          echo "================================================================"

      - name: Archive ExtentReport Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-html-report
          path: |
            reports/
            test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
