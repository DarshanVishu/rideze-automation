name: Rideze Automation Regression Suite

on:
  push:
    branches: ["qa-automation-suite", "main"]
  pull_request:
    branches: ["qa-automation-suite", "main"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - staging
          - dev

jobs:
  test:
    name: Run Full E2E & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        run: |
          pnpm install --frozen-lockfile || pnpm install

      - name: Build and Start Frontend on Port 3001
        env:
          PORT: 3001
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          pnpm run build || true
          nohup pnpm run start -- -p 3001 > web.log 2>&1 &
          echo "Started web server in background."

      - name: Block and Wait for Frontend (Port 3001)
        run: |
          echo "Waiting for http://localhost:3001/login to return HTTP 200/302..."
          for i in {1..30}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || true)
            echo "Attempt $i: Received HTTP $STATUS"
            if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
              echo "Server is fully UP and accepting traffic!"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60 seconds. Showing web.log output:"
          cat web.log || true
          exit 1

      - name: Ensure Google Chrome is Installed
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run TestNG Suite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CUSTOMER_BASE_URL: "http://localhost:3001"
          CUSTOMER_PHONE: ${{ secrets.CUSTOMER_PHONE }}
          CUSTOMER_OTP: ${{ secrets.CUSTOMER_OTP }}
        run: |
          TARGET_ENV="${{ github.event.inputs.target_env || 'qa' }}"
          mvn clean test \
            -Denv=$TARGET_ENV \
            -DbaseUrl="http://localhost:3001" \
            -Dheadless=true \
            -Dtest="!DriverShiftStatusTest"

      - name: Print Failure Summary to Console
        if: always()
        run: |
          echo "==================== TEST FAILURES SUMMARY ===================="
          if [ -d "target/surefire-reports" ]; then
            grep -rn "FAILURE" target/surefire-reports/*.txt 2>/dev/null || true
            grep -rn "ERROR" target/surefire-reports/*.txt 2>/dev/null || true
            for file in target/surefire-reports/*.txt; do
              if grep -q "FAILURE\|ERROR" "$file"; then
                echo "------------------- Content of $file -------------------"
                head -n 25 "$file"
              fi
            done
          else
            echo "No surefire reports directory found."
          fi
          echo "================================================================"

      - name: Archive ExtentReport Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-html-report
          path: reports/ExtentReport.html
          retention-days: 14

      - name: Archive Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14
