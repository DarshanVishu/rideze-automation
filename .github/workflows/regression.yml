name: Rideze Automation Regression Suite

on:
  push:
    branches: [ test, main, qa-automation-suite ]
  pull_request:
    branches: [ test, main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Full E2E & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run TestNG Regression Suite
        run: |
          mvn clean test -Dheadless=true

      - name: Archive Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
