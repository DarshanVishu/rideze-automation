name: Rideze Automation Regression Suite

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to run against'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - dev

jobs:
  test:
    name: Run Full E2E & Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run TestNG Suite
        run: |
          mvn clean test -Denv=${{ github.event.inputs.target_env }} -Dheadless=true

      - name: Archive Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
